version: "3.9"

services:
  agromart_db_service:
    container_name: agromart_db_container
    restart: always
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agromart_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - ../data:/var/lib/postgresql/data
